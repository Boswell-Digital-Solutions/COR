name: CI

on:
  push:
    branches: [master]
    paths:
      - '**'
      - '!docs/**'
      - '!doc/**'
      - '!**/*.md'
      # Test fixtures that are Markdown: tests and the benchmark scripts read them.
      - 'tests/**'
      # Scrivener fixtures (some are Markdown): test_scrivener_authority_recon walks them.
      - 'fixtures/**'
  pull_request:
    branches: [master]
    paths:
      - '**'
      - '!docs/**'
      - '!doc/**'
      - '!**/*.md'
      # Test fixtures that are Markdown: tests and the benchmark scripts read them.
      - 'tests/**'
      # Scrivener fixtures (some are Markdown): test_scrivener_authority_recon walks them.
      - 'fixtures/**'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install validation dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Validate schemas
        run: make validate

      - name: Run runtime tests
        run: make test-runtime

      - name: Test repo crawler
        run: make test-repo-crawler

      - name: Test worm
        run: make test-worm
